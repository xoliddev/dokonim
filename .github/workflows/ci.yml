name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit + DB tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dokonim_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # every DB/API suite runs on PGlite and, with this set, on real PostgreSQL 16 too (adapter parity)
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/dokonim_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # the DB and API suites each reset the shared Postgres schema, so they run one after the other
      - name: Unit tests (core, payments, i18n, contract, seed, bot, miniapp)
        run: npx vitest run --project core --project payments --project i18n --project contract --project seed --project bot --project miniapp
      - name: DB tests (PGlite + Postgres 16)
        run: npx vitest run --project db
      - name: API tests (PGlite + Postgres 16)
        run: npx vitest run --project api

  e2e:
    name: Playwright (1440 px + 375 px)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:demo
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
