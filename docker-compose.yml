# Local/full stack: Postgres 17 + the API on http://localhost:8080
#   cp .env.example .env   # then fill in the secrets (see comments there)
#   docker compose up --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dokonim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dokonim}
      POSTGRES_DB: dokonim
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dokonim -d dokonim"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # The compose network address wins over whatever DATABASE_URL says in .env.
      DATABASE_URL: postgres://dokonim:${POSTGRES_PASSWORD:-dokonim}@db:5432/dokonim
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
